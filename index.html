<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASA Bike Shop — Katalog Online</title>
<meta name="description" content="ASA Bike Shop and Accessories, Tabanan. Katalog sepeda, ban, sparepart, dan aksesoris. Pesan langsung lewat WhatsApp.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<script>try{var t=localStorage.getItem('asa-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* ASA Bike Shop — warna mengikuti tema hape (terang/gelap) */
:root{
  --bg:#f9fafb; --panel:#ffffff; --fg:#111827; --muted:#6b7280; --faint:#9ca3af;
  --line:#e5e7eb; --soft:#f3f4f6; --soft2:#f9fafb;
  --green:#059669; --green-hover:#10b981; --green-text:#047857; --green-tint:#ecfdf5;
  --amber:#f59e0b; --amber-tint:#fffbeb; --amber-line:#fde68a; --amber-text:#92400e;
  --red:#ef4444; --red-tint:#fef2f2; --red-text:#b91c1c; --red-line:#fecaca; --ink:#000000; --ink-fg:#ffffff; --scrim:rgba(0,0,0,.55);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090b; --panel:#18181b; --fg:#f3f4f6; --muted:#a1a1aa; --faint:#71717a;
  --line:#27272a; --soft:#27272a; --soft2:#1f1f23;
  --green:#059669; --green-hover:#10b981; --green-text:#34d399; --green-tint:#052e22;
  --amber:#f59e0b; --amber-tint:#2b2108; --amber-line:#5c4510; --amber-text:#fcd34d;
  --red:#ef4444; --red-tint:#2a1212; --red-text:#fca5a5; --red-line:#5b1f1f; --ink:#ffffff; --ink-fg:#000000; --scrim:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --panel:#18181b; --fg:#f3f4f6; --muted:#a1a1aa; --faint:#71717a;
  --line:#27272a; --soft:#27272a; --soft2:#1f1f23;
  --green:#059669; --green-hover:#10b981; --green-text:#34d399; --green-tint:#052e22;
  --amber:#f59e0b; --amber-tint:#2b2108; --amber-line:#5c4510; --amber-text:#fcd34d;
  --red:#ef4444; --red-tint:#2a1212; --red-text:#fca5a5; --red-line:#5b1f1f; --ink:#ffffff; --ink-fg:#000000; --scrim:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;overflow:hidden}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.logo-img{display:block;height:34px;width:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-img{filter:invert(1)}}
:root[data-theme="dark"] .logo-img{filter:invert(1)}

/* ---------- hape ---------- */
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mico{display:inline-block;width:1em;height:1em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}
.tile .bx .mico{width:1.1em;height:1.1em}
.greet{font-size:13px;font-weight:700;color:var(--green-text);display:flex;align-items:center;gap:6px}
.pay-yes{background:var(--green-tint);color:var(--green-text);border:1px solid var(--green)}
.pay-no{background:var(--red-tint);color:var(--red-text);border:1px solid var(--red-line)}
.owe{background:var(--red-tint);border:1px solid var(--red-line);color:var(--red-text);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.owe b{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-height:61px}
.topbar .spacer{flex:1}
.topbar .ttl{flex:1;font-size:16px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;flex-shrink:0}
.loginbtn{height:40px;padding:0 14px;border-radius:12px;border:none;background:var(--ink);color:var(--ink-fg);display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;cursor:pointer}
.cartbtn{height:40px;padding:0 12px;border-radius:12px;border:none;background:var(--green);color:#fff;display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;cursor:pointer}
.cartbtn .ico{font-size:18px}
.cartbtn .n{background:#fff;color:#047857;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;position:relative}
.view{padding:14px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:6px}
.hero h3{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0}
.hero p{font-size:13px;color:var(--muted);margin:0}
.lockban{background:var(--amber-tint);border:1px solid var(--amber-line);color:var(--amber-text);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px;margin-top:6px}
.lockban button{border:none;background:none;padding:0;font-weight:800;text-decoration:underline;text-underline-offset:2px;cursor:pointer;color:inherit;text-align:left;font-size:13px}
.srch{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--faint)}
.srch .ico{font-size:17px}
.srch input{flex:1;min-width:0;border:none;background:transparent;outline:none;color:var(--fg);font-size:15px}
.srch input::placeholder{color:var(--faint)}
.sel{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:14px;font-weight:600;color:var(--fg)}
.h{font-weight:800;font-size:15px;margin:2px 0 0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;padding:0}
.tile .bx{width:62px;height:62px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:27px;transition:transform .15s,border-color .15s,box-shadow .15s}
.tile:hover .bx{border-color:var(--faint);box-shadow:0 6px 14px -8px rgba(0,0,0,.3);transform:translateY(-2px)}
.tile:active .bx{transform:scale(.92)}
.tile.po .bx{background:var(--amber-tint);border-color:var(--amber-line);color:var(--amber-text)}
.tile .lb{font-size:12px;font-weight:600;text-align:center;line-height:1.25}
.tile.soon{opacity:.42}
.tile.soon .bx{border-style:dashed;background:var(--soft2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.chip{flex-shrink:0;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;background:var(--panel);transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.count{font-size:12px;color:var(--muted);font-weight:500;margin:-4px 0 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .18s,box-shadow .18s}
.pc:hover{transform:translateY(-2px);box-shadow:0 10px 22px -14px rgba(0,0,0,.35)}
.pc .img{position:relative;aspect-ratio:1;max-width:100%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:52px;cursor:pointer;border:none;padding:0;width:100%;overflow:hidden}
.pc .img .ph,.pc .img>span:first-child{transition:transform .3s}
.pc:hover .img>span:first-child{transform:scale(1.05)}
.pc .bd{padding:10px;display:flex;flex-direction:column;flex:1;gap:2px}
.pc .nm{font-weight:700;font-size:13px;line-height:1.3;min-height:2.6em;cursor:pointer}
.pc .ket{font-size:11px;color:var(--muted)}
.pr{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.lockp{font-size:12px;font-weight:600;color:var(--faint);display:flex;align-items:center;gap:4px}
.pc .mn{font-size:11px;color:var(--muted);margin-bottom:8px}
.pc .act{margin-top:auto}
.badge{position:absolute;top:8px;left:8px;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.b-ok{background:var(--green)} .b-low{background:var(--red)} .b-po{background:var(--amber)}
.c-bike{color:#f59e0b} .c-mini{color:#ec4899} .c-mtb{color:#14b8a6} .c-gen{color:#6b7280}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.ph img,.ph svg.photo{width:100%;height:100%;object-fit:contain;display:block}
.btn{width:100%;height:40px;border-radius:12px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:background .15s,transform .12s}
.btn:hover{background:var(--green-hover)}
.btn:active{transform:scale(.96)}
.btn.out{background:transparent;border:1px solid var(--line);color:var(--fg);box-shadow:none}
.btn .ico{font-size:16px}
.stepc{display:flex;align-items:center;justify-content:space-between;height:40px;border-radius:12px;border:1px solid var(--green);background:var(--green-tint)}
.stepc.short{border-color:var(--amber);background:var(--amber-tint)}
.stepc button,.mini-step button,.cstep button{border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;height:100%;transition:transform .1s}
.stepc button:active,.mini-step button:active,.cstep button:active{transform:scale(.85)}
.stepc button{width:40px;font-size:15px}
.stepc span,.mini-step span{font-weight:800;font-size:14px}
.hint{font-size:11px;font-weight:600;color:var(--amber-text);text-align:center;margin:4px 0 0}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 12px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
button.row{width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
button.row.soon{opacity:.42}
button.row.soon .th{border-style:dashed}
.th{position:relative;width:56px;height:56px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0;cursor:pointer;overflow:hidden}
.info{flex:1;min-width:0;cursor:pointer}
.info .nm{font-weight:700;font-size:13.5px;line-height:1.3;display:block}
.sm{font-size:11.5px;color:var(--muted)}
.add{height:38px;padding:0 12px;border-radius:12px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;transition:transform .12s}
.add:active{transform:scale(.94)}
.add.out{background:transparent;border:1px solid var(--line);color:var(--fg)}
.add .ico{font-size:15px}
.mini-step{display:flex;align-items:center;border:1px solid var(--green);background:var(--green-tint);border-radius:12px;height:38px}
.mini-step.short{border-color:var(--amber);background:var(--amber-tint)}
.mini-step button{width:34px;font-size:14px}
.mini-step span{min-width:22px;text-align:center;font-size:13px}
.soonbox{text-align:center;padding:36px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--panel);border:1px dashed var(--line);border-radius:16px}
.soonbox .ic{width:76px;height:76px;border-radius:22px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--faint)}
.soonbox h4{margin:2px 0 0;font-size:19px;font-weight:800}
.soonbox p{margin:0;font-size:13.5px;color:var(--muted);max-width:28ch}
.tag{display:inline-block;background:var(--ink);color:var(--ink-fg);font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 10px;border-radius:999px}
.big{height:50px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;flex-shrink:0;transition:transform .12s,filter .15s}
.big:active{transform:scale(.97)}
.big .ico{font-size:20px}
.green{background:var(--green);color:#fff}
.inkb{background:var(--ink);color:var(--ink-fg)}
.ghost{background:var(--panel);border:1px solid var(--line)}
.ghost.red{color:var(--red)}
.empty{text-align:center;padding:36px 0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted)}
.empty .ico{font-size:46px;color:var(--faint)}
.fbar{padding:8px 14px 0;background:linear-gradient(to top,var(--bg) 60%,transparent)}
.fbar button{width:100%;height:52px;border-radius:16px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;cursor:pointer;box-shadow:0 8px 20px -8px rgba(5,150,105,.6)}
.fbar span{display:flex;align-items:center;gap:8px}
.h.sec{margin-top:18px}
.order{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.order>button{width:100%;background:none;border:none;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer}
.order .top{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.order .no{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.order .meta{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:12.5px;color:var(--muted)}
.order .meta b{color:var(--fg);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.order .chev{color:var(--faint);font-size:16px;transition:transform .25s}
.order.open .chev{transform:rotate(90deg)}
.order .det{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;animation:tabIn .25s ease both}
.order .det .ln{display:flex;justify-content:space-between;gap:10px}
.edit{display:flex;flex-direction:column;gap:10px;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:10px}
.erow{display:flex;flex-direction:column;gap:6px;padding-bottom:9px;border-bottom:1px dashed var(--line)}
.ectl{display:flex;gap:8px;align-items:center}
.eq{width:40px;text-align:center;border:none;background:transparent;font-weight:800;color:var(--fg);font-size:16px;outline:none;padding:0}
.eprice{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 10px;font-size:12px;color:var(--muted)}
.eprice:focus-within{border-color:var(--green);box-shadow:0 0 0 2px var(--green-tint)}
.eprice input{flex:1;min-width:0;border:none;background:transparent;color:var(--fg);font-weight:800;font-size:16px;text-align:right;outline:none;font-variant-numeric:tabular-nums}
.old{color:var(--muted);text-decoration:line-through}
.st{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-baru{background:var(--soft);color:var(--fg)}
.st-proses{background:var(--amber-tint);color:var(--amber-text);border:1px solid var(--amber-line)}
.st-kirim{background:var(--green-tint);color:var(--green-text)}
.st-selesai{background:var(--green);color:#fff}
.steps{display:flex;gap:4px;margin-top:2px;width:100%}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--green)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:6px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel)}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--faint);cursor:pointer;padding:4px 0;position:relative;transition:color .2s}
.nav button .ico{font-size:22px;transition:transform .2s}
.nav button.on{color:var(--green-text)}
.nav button.on .ico{transform:translateY(-2px)}
.nav .dot{position:absolute;top:0;left:calc(50% + 6px);background:var(--green);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* bottom sheet (detail, keranjang, login) seperti web sekarang */
.sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fadeIn .25s ease both}
.sheet .panel{position:relative;background:var(--panel);border-radius:24px 24px 0 0;max-height:90%;display:flex;flex-direction:column;animation:sheetUp .32s cubic-bezier(.2,.9,.3,1) both;box-shadow:0 -10px 30px -12px rgba(0,0,0,.4)}
.sheet.closing .scrim{animation:fadeOut .22s ease both}
.sheet.closing .panel{animation:sheetDown .22s ease-in both}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex-shrink:0}
.shead{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.shead b{font-size:16px;font-weight:800;flex:1}
.sbody{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.sfoot{border-top:1px solid var(--line);background:var(--soft2);padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.x{width:38px;height:38px;border-radius:50%;border:none;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.detail-img{position:relative;background:#fff;border-radius:16px;aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;font-size:90px;overflow:hidden;border:1px solid var(--line)}
.dttl{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.bigprice{font-size:24px;font-weight:900;color:var(--green-text);font-variant-numeric:tabular-nums}
.box{background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.5}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.citem{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--soft2)}
.citem.short{border-color:var(--amber);background:var(--amber-tint)}
.citem .th{width:58px;height:58px}
.cstep{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);height:34px}
.cstep button{width:34px;font-size:13px}
.cstep span{width:26px;text-align:center;font-weight:700;font-size:13px}
.sub{font-weight:800;font-size:13.5px;color:var(--green-text)}
.fl{font-size:12px;font-weight:600;margin-bottom:4px}
.ro{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.inp{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 12px;color:var(--fg)}
.inp.pin{letter-spacing:.5em;text-align:center;font-weight:800}
.err{color:var(--red);font-size:13px;margin:0}
.total{display:flex;justify-content:space-between;align-items:flex-end}
.total b{font-size:20px;font-weight:900;color:var(--green-text);font-variant-numeric:tabular-nums}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:24px 8px}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--green-tint);color:var(--green-text);display:flex;align-items:center;justify-content:center;font-size:40px;animation:popIn .45s cubic-bezier(.2,1.4,.4,1) both}
.toast{position:absolute;left:14px;right:14px;top:70px;background:var(--green);color:#fff;border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center;opacity:0;transform:translateY(-10px) scale(.98);transition:opacity .22s,transform .22s;pointer-events:none;box-shadow:0 10px 25px -10px rgba(0,0,0,.4);z-index:30}
.toast.amber{background:#d97706}
.toast.show{opacity:1;transform:none}
.flydot{position:absolute;z-index:40;width:22px;height:22px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(5,150,105,.25);pointer-events:none}

/* ---------- efek ---------- */
@keyframes fwdIn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes backIn{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes tabIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes itemIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28)}70%{transform:scale(.94)}100%{transform:scale(1)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes barIn{from{transform:translateY(120%)}to{transform:none}}
.a-fwd{animation:fwdIn .3s cubic-bezier(.2,.8,.3,1) both}
.a-back{animation:backIn .3s cubic-bezier(.2,.8,.3,1) both}
.a-tab{animation:tabIn .32s cubic-bezier(.2,.8,.3,1) both}
.stagger>*{animation:itemIn .34s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.pop{animation:popIn .3s cubic-bezier(.2,1.4,.4,1) both}
.bump{animation:bump .45s ease}
.shake{animation:shake .3s ease 2}
.fbar.enter button{animation:barIn .35s cubic-bezier(.2,1.2,.4,1) both}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


/* ---------- aplikasi ---------- */
.app{max-width:560px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 40px -20px rgba(0,0,0,.25)}}
.skel{height:220px;border-radius:16px;background:linear-gradient(90deg,var(--soft) 0%,var(--soft2) 50%,var(--soft) 100%);background-size:200% 100%;animation:skel 1.2s linear infinite}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
a.big,a.btn{color:inherit}
a.big.green,a.btn.green{color:#fff}
button:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<div class="app" id="phone">
  <div class="topbar" id="topbar"></div>
  <div class="scr" id="scr"><div class="view" id="view"></div></div>
  <div id="bottom"></div>
  <nav class="nav" id="nav" aria-label="Menu utama"></nav>
  <div id="sheetRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
// ==========================================================
// PENGATURAN TOKO
// ==========================================================
const STORE_NAME = 'ASA Bike Shop';
const STORE_WA_NUMBER = '6285111418200';   // 0851-1141-8200
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMkPiULyLNpd2elzMn-jWJxSEs2L_f0KSDmR2ew_9R48pIKbpD_AY-6uLRsbSovo4/exec';
const SOROTAN_MAX = 4;

// Kelompok barang (kotak kategori di beranda). Kelompok tanpa barang tampil redup ("Akan datang").
const GROUPS = [
  { n: 'Sepeda', icon: 'bicycle.png', view: 'card', min: 2 },
  { n: 'Ban', icon: 'car.png', view: 'list', min: 1 },
  { n: 'Sparepart', icon: 'gear.png', view: 'list', min: 1 },
  { n: 'Aksesoris', svg: 'bell', view: 'list', min: 1 },
  { n: 'Baby walker', icon: 'baby-walker.png', view: 'card', min: 1 },
  { n: 'Roda tiga', icon: 'tricycle.png', view: 'card', min: 1 },
  { n: 'Tolo car', svg: 'car', view: 'card', min: 1 },
  { n: 'Pre-order', svg: 'clock', view: 'card', min: 2 }
];

// ==========================================================
// IKON
// ==========================================================
const I = {
  home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/>',
  grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  cart: '<circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2.2l2.4 11.2h10.6l2-8.2H6.3"/>',
  cartplus: '<circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2.2l2.4 11.2h10.6l2-8.2H6.3"/><path d="M13 8.5v4M11 10.5h4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  back: '<path d="M15 5.5 8.5 12l6.5 6.5"/>',
  chev: '<path d="m9.5 6 6 6-6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
  login: '<path d="M10 4.5h8v15h-8"/><path d="M3.5 12H14M10.5 8.5 14 12l-3.5 3.5"/>',
  bell: '<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5h4"/>',
  car: '<path d="M4.5 16.5V12l2.2-5h10.6l2.2 5v4.5"/><path d="M3 16.5h18"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/><path d="M4.5 12h15"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  box: '<path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>',
  wa: '<path d="M4 20.5 5.4 16.6A8.2 8.2 0 1 1 8.4 19.3z"/><path d="M9 9.5c.3 2.6 2.4 4.8 5.2 5.3l1.1-1.2-1.8-.9-.7.7c-1-.4-1.8-1.2-2.2-2.2l.7-.7-.9-1.8z"/>',
  userpen: '<circle cx="10" cy="8" r="3.5"/><path d="M3.5 19.5c.7-3 3.2-4.5 6.5-4.5"/><path d="m14 20 .5-2.5 5-5 2 2-5 5z"/>',
  alert: '<path d="M12 4 21 19.5H3z"/><path d="M12 10v4.5M12 17v.1"/>',
  check: '<circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.2 2.4 2.3 4.6-4.8"/>',
  receipt: '<path d="M6 3.5h12v17l-2-1.3-2 1.3-2-1.3-2 1.3-2-1.3-2 1.3z"/><path d="M9 8h6M9 12h6"/>',
  out: '<path d="M14 4.5H6v15h8"/><path d="M11 12h9.5M17 8.5l3.5 3.5-3.5 3.5"/>',
  trash: '<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>'
};
const ic = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${I[n] || I.box}</svg>`;
const gicon = g => g && g.icon ? `<span class="mico" aria-hidden="true" style="--m:url(${g.icon})"></span>` : ic(g ? g.svg : 'box');

// ==========================================================
// STATE & HELPER
// ==========================================================
const S = { v: 'home', group: null, sub: 'Semua', sort: 'default', q: '', cq: '', cart: [], user: null, token: '',
  sheet: null, products: [], loaded: false, loadError: false, apiVersion: 1,
  orders: null, ordersLoading: false, ordersError: '', open: null, hf: 'semua', hq: '', edit: null, draft: null };
const hist = [];
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const num = n => Math.round(n || 0).toLocaleString('id-ID');
const digits = s => parseInt(String(s).replace(/\D/g, ''), 10) || 0;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const logged = () => !!S.user;
const isOwner = () => !!S.user && S.user.role === 'owner';
const groupOf = name => GROUPS.find(g => g.n.toLowerCase() === String(name || '').toLowerCase()) || null;
const prod = id => S.products.find(p => p.id === +id);
const visible = p => p.po || p.stock > 0;                     // stok 0 disembunyikan (kecuali pre-order)
const inGroup = g => S.products.filter(p => visible(p) && p.group.toLowerCase() === g.n.toLowerCase());
const inCart = id => S.cart.find(x => x.id === +id);
const maxQ = p => p.po ? 999 : p.stock;
const minOf = p => Math.min(p.min || (groupOf(p.group) || { min: 1 }).min, maxQ(p));
const totals = () => S.cart.reduce((t, c) => { const p = prod(c.id); if (p) { t.q += c.q; t.p += (p.price || 0) * c.q; } return t; }, { q: 0, p: 0 });
const subLabel = s => ({ bmx: 'BMX', mtb: 'MTB', mini: 'Mini' }[s] || (s ? s.charAt(0).toUpperCase() + s.slice(1) : ''));
const tone = p => p.group === 'Sepeda' ? ({ bmx: 'c-bike', mini: 'c-mini', mtb: 'c-mtb' }[p.sub] || 'c-gen') : p.po ? 'c-bike' : 'c-gen';
function greeting() { const h = new Date().getHours(); return h < 4 ? 'Selamat malam' : h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam'; }

function normalizeProduct(p, i) {
  const n = v => parseInt(String(v ?? '').replace(/[^\d]/g, ''), 10) || 0;
  const cat = String(p.sub ?? p.category ?? '').trim().toLowerCase();
  const po = !!p.po || cat === 'pre-order' || cat === 'po';
  let group = String(p.group || '').trim();
  if (!group) group = po ? 'Pre-order' : ['bmx', 'mini', 'mtb'].includes(cat) ? 'Sepeda' : (cat ? cat.charAt(0).toUpperCase() + cat.slice(1) : 'Lainnya');
  const g = groupOf(group);
  return {
    id: n(p.id) || i + 1, name: String(p.name || '').trim(),
    price: p.price === undefined || p.price === null ? null : n(p.price),
    stock: n(p.stock), group: g ? g.n : group, sub: (cat === 'pre-order' || cat === 'po') ? '' : cat,
    image: String(p.image || '').trim(), keterangan: String(p.keterangan || '').trim(),
    satuan: String(p.satuan || '').trim(), min: n(p.min), sorotan: !!p.sorotan, po
  };
}

function thumb(p) {
  if (p.image) return `<span class="ph"><img src="${esc(p.image)}" alt="" loading="lazy" data-g="${esc(p.group)}" data-tone="${tone(p)}" onerror="imgFail(this)"></span>`;
  return `<span class="${tone(p)}">${gicon(groupOf(p.group))}</span>`;
}
// Foto gagal dimuat -> tampilkan ikon kategori
function imgFail(img) { const s = document.createElement('span'); s.className = img.dataset.tone || 'c-gen'; s.innerHTML = gicon(groupOf(img.dataset.g)); img.parentNode.replaceWith(s); }
function badge(p) {
  if (p.po) return '<span class="badge b-po">Pre-Order</span>';
  if (p.stock <= 3) return `<span class="badge b-low">Sisa ${p.stock}</span>`;
  return `<span class="badge b-ok">Stok ${p.stock}</span>`;
}
function price(p, cls) {
  return logged() && p.price !== null ? `<div class="${cls || 'pr'}">${rp(p.price)}${p.satuan ? `<span class="sm" style="font-weight:600"> /${esc(p.satuan)}</span>` : ''}</div>` : `<div class="lockp">${ic('lock')}Harga setelah masuk</div>`;
}
function minLabel(p) {
  const m = minOf(p);
  if (m > 1) return `Min. beli ${m} ${esc(p.satuan || 'unit')}`;
  const g = groupOf(p.group);
  return (p.min || (g && g.min)) > 1 ? 'Stok terakhir' : 'Bisa beli satuan';
}

// ==========================================================
// KONEKSI KE GOOGLE APPS SCRIPT
// ==========================================================
async function callScript(payload, timeoutMs = 25000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), signal: controller.signal });
    return await res.json();
  } finally { clearTimeout(timer); }
}
function saveToken(t) { S.token = t || ''; try { t ? localStorage.setItem('asa-token', t) : localStorage.removeItem('asa-token'); } catch (e) {} }
function saveCart() { try { localStorage.setItem('asa-cart', JSON.stringify(S.cart)); } catch (e) {} }
function syncCart() {
  S.cart = S.cart.map(c => ({ id: +c.id, q: +c.q, p: prod(c.id) }))
    .filter(c => c.p && visible(c.p) && c.q > 0)
    .map(c => ({ id: c.id, q: Math.min(c.q, maxQ(c.p)) }));
}

async function loadProducts() {
  try {
    let data;
    if (S.token) {
      data = await callScript({ action: 'products', token: S.token });
      if (data.ok && !data.auth) saveToken('');
    } else {
      data = await (await fetch(APPS_SCRIPT_URL, { cache: 'no-store' })).json();
    }
    if (!data.ok) throw new Error(data.message || data.error);
    S.apiVersion = data.version || 1;
    S.user = data.auth ? { role: 'customer', ...data.customer } : null;
    S.products = (data.products || []).map(normalizeProduct).filter(p => p.name);
    S.loaded = true; S.loadError = false;
  } catch (err) {
    console.warn('Gagal memuat katalog:', err);
    if (!S.products.length) S.loadError = true;
  }
  try { S.cart = JSON.parse(localStorage.getItem('asa-cart') || '[]'); } catch (e) { S.cart = []; }
  if (!Array.isArray(S.cart)) S.cart = [];
  syncCart();
}

async function loadOrders(force) {
  if (!logged() || S.apiVersion < 2) return;
  if (S.orders && !force) return;
  S.ordersLoading = true; S.ordersError = '';
  if (S.v === 'hist') $('view').innerHTML = V.hist();
  try {
    const r = await callScript({ action: 'history', token: S.token });
    if (r.ok) S.orders = r.orders || [];
    else if (r.error === 'auth') { await signedOut('Sesi Anda sudah berakhir. Silakan masuk lagi.'); return; }
    else S.ordersError = r.message || 'Riwayat belum bisa dimuat';
  } catch (e) { S.ordersError = 'Tidak bisa terhubung. Periksa internet Anda.'; }
  S.ordersLoading = false;
  if (S.v === 'hist') { $('view').innerHTML = V.hist(); }
}

// ==========================================================
// TOAST & EFEK
// ==========================================================
let tt;
function toast(msg, amber) {
  const t = $('toast'); t.className = 'toast' + (amber ? ' amber' : '');
  t.innerHTML = ic(amber ? 'alert' : 'check') + '<span></span>'; t.querySelector('span').textContent = msg;
  requestAnimationFrame(() => t.classList.add('show')); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600);
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function bump() { ['#cartBtn', '#navCart'].forEach(s => { const el = document.querySelector(s); if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } }); }
function fly(fromEl) {
  if (reduce || !fromEl || !fromEl.isConnected) return bump();
  const target = document.querySelector('#cartBtn') || document.querySelector('#navCart'); if (!target) return;
  const ph = $('phone').getBoundingClientRect(), a = fromEl.getBoundingClientRect(), b = target.getBoundingClientRect();
  const d = document.createElement('div'); d.className = 'flydot'; $('phone').appendChild(d);
  const x0 = a.left + a.width / 2 - ph.left - 11, y0 = a.top + a.height / 2 - ph.top - 11, x1 = b.left + b.width / 2 - ph.left - 11, y1 = b.top + b.height / 2 - ph.top - 11;
  const anim = d.animate([{ transform: `translate(${x0}px,${y0}px) scale(1)` }, { transform: `translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 60}px) scale(1.15)`, offset: .5 }, { transform: `translate(${x1}px,${y1}px) scale(.35)`, opacity: .6 }], { duration: 620, easing: 'cubic-bezier(.4,0,.2,1)' });
  let done = false; const end = () => { if (done) return; done = true; d.remove(); bump(); };
  anim.onfinish = end; setTimeout(end, 900);
}

// ==========================================================
// KERANJANG
// ==========================================================
function change(id, d, fromEl) {
  if (!logged()) { openSheet('login'); return; }
  const p = prod(id); if (!p) return;
  const e = inCart(id);
  if (!e) {
    if (d <= 0) return;
    S.cart.push({ id: p.id, q: 1 });
    const need = minOf(p) - 1;
    need > 0 ? toast(`Masuk keranjang. Tambah ${need} lagi, minimal ${minOf(p)}`, true) : toast(`${p.name} masuk keranjang`);
    fly(fromEl); refresh(); return;
  }
  const n = e.q + d;
  if (n <= 0) S.cart = S.cart.filter(x => x !== e);
  else if (n > maxQ(p)) { toast(`Stok hanya ${p.stock}`, true); return; }
  else e.q = n;
  if (d > 0) fly(fromEl);
  refresh();
}
function stepper(p, cls) {
  const e = inCart(p.id); const short = e.q < minOf(p);
  return `<div class="${cls}${short ? ' short' : ''} pop"><button data-ch="${p.id}" data-d="-1" aria-label="Kurangi">${ic(e.q <= 1 ? 'trash' : 'minus')}</button><span>${e.q}</span><button data-ch="${p.id}" data-d="1" aria-label="Tambah">${ic('plus')}</button></div>${short && cls === 'stepc' ? `<p class="hint">Tambah ${minOf(p) - e.q} lagi (min. ${minOf(p)})</p>` : ''}`;
}
function cardAction(p) {
  if (!logged()) return `<button class="btn out" data-login="1">${ic('login')}Masuk untuk beli</button>`;
  return inCart(p.id) ? stepper(p, 'stepc') : `<button class="btn" data-ch="${p.id}" data-d="1">${ic(p.po ? 'clock' : 'cartplus')}${p.po ? 'Pre-Order' : 'Keranjang'}</button>`;
}
function rowAction(p) {
  if (!logged()) return `<button class="add out" data-login="1">${ic('lock')}Masuk</button>`;
  return inCart(p.id) ? stepper(p, 'mini-step') : `<button class="add" data-ch="${p.id}" data-d="1">${ic('plus')}Tambah</button>`;
}
function pcard(p, i) {
  return `<article class="pc" style="--i:${i || 0}"><button class="img" data-item="${p.id}" aria-label="Detail ${esc(p.name)}">${thumb(p)}${badge(p)}</button>
  <div class="bd"><div class="nm" data-item="${p.id}">${esc(p.name)}</div>${p.keterangan ? `<div class="ket">${esc(p.keterangan)}</div>` : ''}${price(p)}<div class="mn">${minLabel(p)}</div><div class="act" data-act="${p.id}">${cardAction(p)}</div></div></article>`;
}
function prow(p, i) {
  return `<div class="row" style="--i:${i || 0}"><span class="th" data-item="${p.id}">${thumb(p)}</span><div class="info" data-item="${p.id}"><span class="nm">${esc(p.name)}</span>${price(p)}<div class="sm">${p.po ? 'Pre-order' : p.stock <= 3 ? `<span style="color:var(--red);font-weight:600">Sisa ${p.stock}</span>` : `Stok ${p.stock}`}${p.keterangan ? ' · ' + esc(p.keterangan) : ''}${minOf(p) > 1 ? ` · min. ${minOf(p)}` : ''}</div></div><div data-ract="${p.id}">${rowAction(p)}</div></div>`;
}

// ==========================================================
// HALAMAN
// ==========================================================
function sorted(items) {
  const a = [...items];
  if (S.sort === 'low') a.sort((x, y) => x.price - y.price);
  else if (S.sort === 'high') a.sort((x, y) => y.price - x.price);
  else if (S.sort === 'name') a.sort((x, y) => x.name.localeCompare(y.name, 'id', { numeric: true }));
  return a;
}
function results(items, view) {
  if (!items.length) return `<div class="empty">${ic('search')}<b style="color:var(--fg)">Barang tidak ditemukan</b><span class="sm">Coba kata lain</span></div>`;

  <div style="display:flex;gap:8px"><button class="btn out" data-ecancel="1" style="width:auto;padding:0 16px">Batal</button><button class="btn" data-esave="${esc(o.no)}" id="esaveBtn">${ic('check')}Simpan perubahan</button></div></div>`;
}

    <div class="sbody"><div class="detail-img">${thumb(p)}${badge(p)}</div>
      <div><span class="pill" style="text-transform:uppercase;font-size:11px">${esc(p.group)}${p.sub ? ' · ' + esc(subLabel(p.sub)) : ''}</span>
      <div class="dttl" style="margin-top:8px">${esc(p.name)}</div>${price(p, 'bigprice')}<div class="sm">${minLabel(p)}</div></div>
      ${p.keterangan ? `<div class="box"><div class="lbl">Keterangan</div><div style="white-space:pre-line">${esc(p.keterangan)}</div></div>` : ''}
      <div style="display:flex;gap:8px;align-items:flex-start"><button class="btn out" data-close="1" style="width:auto;padding:0 18px">Tutup</button><div style="flex:1" data-act="${p.id}">${cardAction(p)}</div></div></div>`;
  }
  const t = totals();
  const head = `<div class="grab"></div><div class="shead">${ic('cart')}<b>Keranjang Belanja</b><span class="pill" style="background:var(--green-tint);color:var(--green-text)">${t.q} barang</span><button class="x" data-close="1" aria-label="Tutup">${ic('x')}</button></div>`;
  if (!S.cart.length) return head + `<div class="sbody"><div class="empty">${ic('cart')}<b style="color:var(--fg)">Keranjang masih kosong</b><span class="sm">Pilih barang lalu tekan tombol "Keranjang"</span></div></div>`;
  const alamat = (S.user.alamat || '').trim();
  return head + `<div class="sbody">${S.cart.map(c => { const p = prod(c.id); if (!p) return ''; const need = minOf(p) - c.q;
    return `<div class="citem${need > 0 ? ' short' : ''}" id="ci${p.id}"><span class="th">${thumb(p)}</span><div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:13.5px;line-height:1.3">${esc(p.name)}${p.po ? ' <span style="color:var(--amber);font-size:10px;font-weight:800">[PO]</span>' : ''}</div>
      <div class="sm">${rp(p.price)} / ${esc(p.satuan || 'unit')}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><div class="cstep"><button data-ch="${p.id}" data-d="-1" aria-label="Kurangi">${ic(c.q <= 1 ? 'trash' : 'minus')}</button><span>${c.q}</span><button data-ch="${p.id}" data-d="1" aria-label="Tambah">${ic('plus')}</button></div><span class="sub">${rp(p.price * c.q)}</span></div>
      ${need > 0 ? `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;font-weight:700;color:var(--amber-text)"><span>Minimal ${minOf(p)}</span><button data-ch="${p.id}" data-d="${need}" style="border:none;background:var(--amber);color:#fff;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer">+ Tambah ${need}</button></div>` : ''}
    </div></div>`; }).join('')}
    <div class="lbl" style="margin-top:4px">${ic('userpen')} Data pemesan</div>
    <div><div class="fl">Nama lengkap</div><div class="ro">${esc(S.user.nama || S.user.username)}</div></div>
    ${alamat ? `<div><div class="fl">Alamat pengiriman</div><div class="ro" style="white-space:pre-line">${esc(alamat)}</div><div class="sm" style="margin-top:3px">Sesuai data pelanggan. Hubungi toko untuk mengubah.</div></div>`
      : `<div><label class="fl" for="addr">Alamat pengiriman <span style="color:var(--red)">*</span></label><textarea class="inp" id="addr" rows="3" style="height:auto;padding:10px 12px;resize:none" placeholder="Alamat lengkap"></textarea></div>`}
    <div><label class="fl" for="note">Catatan <span class="sm">(opsional)</span></label><input class="inp" id="note" placeholder="Misal: warna, waktu kirim" maxlength="400"></div>
  </div>
  <div class="sfoot"><div class="total"><div><div class="sm">Total</div><b>${rp(t.p)}</b></div><button data-clear="1" style="border:none;background:none;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;display:flex;gap:4px;align-items:center">${ic('trash')}Kosongkan</button></div>
  <button class="big green" data-send="1" id="sendBtn">${ic('wa')}Kirim Pesanan via WhatsApp</button></div>`;
}
function renderSheet(animate) {
  const root = $('sheetRoot');
  if (!S.sheet) { root.innerHTML = ''; return; }
  if (animate || !root.firstChild) root.innerHTML = `<div class="sheet"><div class="scrim" data-close="1"></div><div class="panel" role="dialog" aria-modal="true">${sheetHTML()}</div></div>`;
  else {
    const panel = root.querySelector('.panel'); const body = panel.querySelector('.sbody'); const sc = body ? body.scrollTop : 0;
    const note = $('note')?.value, addr = $('addr')?.value;
    panel.innerHTML = sheetHTML();
    const nb = panel.querySelector('.sbody'); if (nb) nb.scrollTop = sc;
    if (note && $('note')) $('note').value = note; if (addr && $('addr')) $('addr').value = addr;
  }
  if (S.sheet === 'login') { setTimeout(() => $('lu')?.focus(), 300); $('loginForm').addEventListener('submit', submitLogin); }
}
function openSheet(name) { S.sheet = name; renderSheet(true); }
function closeSheet() {
  const sh = document.querySelector('.sheet'); if (!sh) { S.sheet = null; return; }
  if (reduce) { S.sheet = null; renderSheet(); return; }
  sh.classList.add('closing'); setTimeout(() => { S.sheet = null; renderSheet(); }, 210);
}

async function submitLogin(e) {
  e.preventDefault();
  const u = $('lu').value.trim(), pin = $('lp').value.trim(), err = $('lerr');
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!u) return fail('Masukkan username');
  if (!/^\d{4,6}$/.test(pin)) { $('lp').classList.remove('shake'); void $('lp').offsetWidth; $('lp').classList.add('shake'); return fail('PIN harus 4 sampai 6 angka'); }
  const btn = $('lsubmit'); btn.disabled = true; btn.textContent = 'Memeriksa…';
  try {
    const r = await callScript({ action: 'login', username: u, pin });
    if (!r.ok) return fail(r.message || 'Gagal masuk. Coba lagi.');
    saveToken(r.token);
    S.user = { role: 'customer', ...r.customer };
    S.orders = null; S.hf = 'semua'; S.hq = ''; S.open = null;
    closeSheet();
    await loadProducts();
    render('tab');
    toast(`Selamat datang, ${S.user.nama || S.user.username}`);
    if (S.v === 'hist') loadOrders(true);
  } catch (ex) { fail('Tidak bisa terhubung. Periksa internet Anda lalu coba lagi.'); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = 'Masuk'; } }
}
async function signedOut(msg) {
  saveToken(''); S.user = null; S.cart = []; saveCart(); S.orders = null; barShown = false; S.open = null; S.edit = null;
  await loadProducts(); render('tab'); if (msg) toast(msg, true);
}

// ---------- kirim pesanan ----------
async function sendOrder() {
  if (!logged()) { closeSheet(); openSheet('login'); return; }
  const short = S.cart.find(c => { const p = prod(c.id); return p && c.q < minOf(p); });
  if (short) { const p = prod(short.id); toast(`"${p.name}" minimal ${minOf(p)}`, true); const el = $('ci' + p.id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } return; }
  const address = (S.user.alamat || '').trim() || ($('addr')?.value || '').trim();
  if (!address) { toast('Alamat pengiriman wajib diisi', true); $('addr')?.focus(); return; }
  const notes = ($('note')?.value || '').trim();
  const btn = $('sendBtn'); btn.disabled = true; btn.innerHTML = 'Memproses pesanan…';
  let orderId = '';
  try {
    const r = await callScript({ action: 'order', token: S.token, address, notes, items: S.cart.map(c => ({ id: c.id, qty: c.q })) });
    if (r.ok) orderId = r.orderId || '';
    else if (r.error === 'auth') { closeSheet(); await signedOut('Sesi Anda sudah berakhir. Silakan masuk lagi.'); openSheet('login'); return; }
    else if (r.error === 'stock') {
      (r.problems || []).forEach(pr => { const p = prod(pr.id); if (p) p.stock = Number(pr.stock) || 0; });
      syncCart(); refresh(); render();
      const f = (r.problems || [])[0];
      toast(f ? `Stok "${f.name}" tinggal ${f.stock}. Keranjang sudah disesuaikan.` : 'Stok berubah, cek keranjang lagi.', true);
      return;
    } else { toast(r.message || 'Pesanan belum bisa dikirim. Coba lagi.', true); return; }
  } catch (e) { toast('Tidak bisa terhubung. Periksa internet Anda lalu coba lagi.', true); return; }
  finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = `${ic('wa')}Kirim Pesanan via WhatsApp`; } }

  const lines = S.cart.map((c, i) => { const p = prod(c.id); return `${i + 1}. *${p.name}*${p.po ? ' *[PRE-ORDER]*' : ''}${p.keterangan ? `\n   Keterangan: ${p.keterangan}` : ''}\n   ${c.q} ${p.satuan || 'unit'} x ${rp(p.price)} = ${rp(p.price * c.q)}`; }).join('\n\n');
  const message = `Halo *${STORE_NAME}*, saya ingin memesan:\n${orderId ? `\n🧾 No. Pesanan: *${orderId}*\n` : ''}\n📋 *RINCIAN PESANAN*\n${lines}\n\n💵 *TOTAL: ${rp(totals().p)}*\n\n👤 Nama: ${S.user.nama || S.user.username}\n📍 Alamat: ${address}\n📝 Catatan: ${notes || '-'}\n\nMohon konfirmasi stok & cara pembayarannya. Terima kasih!`;
  S.cart = []; saveCart(); S.orders = null; closeSheet(); refresh();
  window.location.href = `https://wa.me/${STORE_WA_NUMBER}?text=${encodeURIComponent(message)}`;
}

// ---------- pemilik: simpan perubahan pesanan ----------
async function saveEdit(no) {
  const o = (S.orders || []).find(x => x.no === no); if (!o || !S.draft) return;
  if (S.draft.some(it => !(it.q >= 1) || !(it.p > 0))) { toast('Jumlah minimal 1 dan harga harus diisi', true); return; }
  if (!S.draft.some((it, k) => it.q !== o.items[k].q || it.p !== o.items[k].p)) { S.edit = null; S.draft = null; $('histBody').innerHTML = histList(); toast('Tidak ada perubahan'); return; }
  const btn = $('esaveBtn'); btn.disabled = true; btn.textContent = 'Menyimpan…';
  try {
    const r = await callScript({ action: 'edit_order', token: S.token, no, items: S.draft.map(it => ({ q: it.q, p: it.p })) });
    if (!r.ok) { toast(r.message || 'Perubahan belum tersimpan', true); if (btn.isConnected) { btn.disabled = false; btn.innerHTML = `${ic('check')}Simpan perubahan`; } return; }
    const i = S.orders.findIndex(x => x.no === no); if (i >= 0) S.orders[i] = r.order;
    S.edit = null; S.draft = null;
    $('view').innerHTML = V.hist(); $('view').querySelectorAll('.stagger,.pop').forEach(el => el.classList.remove('stagger', 'pop'));
    toast(`Pesanan ${no} diperbarui. Total baru ${rp(orderTotal(r.order))}`);
    loadProducts(); // stok terbaru
  } catch (e) { toast('Tidak bisa terhubung. Coba lagi.', true); if (btn.isConnected) { btn.disabled = false; btn.innerHTML = `${ic('check')}Simpan perubahan`; } }
}

// ==========================================================
// KLIK & KETIK
// ==========================================================
$('phone').addEventListener('click', e => {
  const t = e.target.closest('button,[data-item],.scrim'); if (!t) return; const d = t.dataset;
  if (d.close) { closeSheet(); return; }
  if (d.login) { openSheet('login'); return; }
  if (d.theme) { const dark = isDark(); document.documentElement.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('asa-theme', dark ? 'light' : 'dark'); } catch (x) {} chrome(); return; }
  if (d.back) { back(); return; }
  if (d.cart) { if (!logged()) { openSheet('login'); return; } openSheet('cart'); return; }
  if (d.go) { if (d.go !== S.v) goTab(d.go); return; }
  if (d.group) { go('list', { group: d.group, sub: 'Semua', sort: 'default', cq: '' }); return; }
  if (d.sub) { S.sub = d.sub; document.querySelectorAll('[data-sub]').forEach(c => c.classList.toggle('on', c.dataset.sub === S.sub)); $('listBody').innerHTML = listBody(); return; }
  if (d.ch) { change(d.ch, +d.d, t); return; }
  if (d.item) { openSheet('item:' + d.item); return; }
  if (d.clear) { S.cart = []; refresh(); return; }
  if (d.send) { sendOrder(); return; }
  if (d.logout) { const tok = S.token; signedOut().then(() => toast('Anda sudah keluar')); if (tok) callScript({ action: 'logout', token: tok }).catch(() => {}); return; }
  if (d.reload) { S.loadError = false; S.loaded = false; render(); loadProducts().then(() => render('tab')); return; }
  if (d.reloadhist) { S.edit = null; S.draft = null; loadOrders(true); return; }
  if (d.edit) { const o = S.orders.find(x => x.no === d.edit); S.edit = o.no; S.draft = o.items.map(it => ({ ...it })); $('histBody').innerHTML = histList(); $('histBody').querySelector('.stagger')?.classList.remove('stagger'); return; }
  if (d.ecancel) { S.edit = null; S.draft = null; $('histBody').innerHTML = histList(); $('histBody').querySelector('.stagger')?.classList.remove('stagger'); return; }
  if (d.eqd !== undefined) { const k = +d.eqd; const it = S.draft[k]; it.q = Math.max(1, it.q + (+d.d)); $('eq' + k).value = it.q; refreshEdit(k); return; }
  if (d.esave) { saveEdit(d.esave); return; }
  if (d.order) { S.edit = null; S.draft = null; S.open = S.open === d.order ? null : d.order; $('histBody').innerHTML = histList(); $('histBody').querySelector('.stagger')?.classList.remove('stagger'); return; }
  if (d.hf) { S.hf = d.hf; S.open = null; S.edit = null; document.querySelectorAll('[data-hf]').forEach(c => c.classList.toggle('on', c.dataset.hf === S.hf)); $('histBody').innerHTML = histList(); return; }
});
$('phone').addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { S.q = el.value; $('homeBody').innerHTML = homeBody(); }
  if (el.id === 'cq') { S.cq = el.value; $('listBody').innerHTML = listBody(); }
  if (el.id === 'hq') { S.hq = el.value; S.open = null; S.edit = null; $('histBody').innerHTML = histList(); }
  if (el.id === 'lp') el.value = el.value.replace(/\D/g, '').slice(0, 6);
  if (el.dataset.eq !== undefined && S.draft) { const k = +el.dataset.eq; const v = digits(el.value); el.value = v || ''; S.draft[k].q = v; refreshEdit(k); }
  if (el.dataset.ep !== undefined && S.draft) { const k = +el.dataset.ep; const v = digits(el.value); el.value = v ? num(v) : ''; S.draft[k].p = v; refreshEdit(k); }
});
$('phone').addEventListener('change', e => { if (e.target.id === 'sort') { S.sort = e.target.value; $('listBody').innerHTML = listBody(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => chrome());

// ==========================================================
// MULAI
// ==========================================================
(async () => {
  try { S.token = localStorage.getItem('asa-token') || ''; } catch (e) {}
  render();
  await loadProducts();
  render('tab');
})();
</script>
</body>
</html>
